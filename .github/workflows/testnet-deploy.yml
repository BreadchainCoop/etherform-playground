name: Testnet Deploy

on:
  push:
    branches: [main]
    tags: [testnet-deploy-*]

jobs:
  ci:
    uses: BreadchainCoop/etherform/.github/workflows/_ci.yml@main
    with:
      check-formatting: false

  deploy-testnet:
    needs: [ci]
    uses: BreadchainCoop/etherform/.github/workflows/_deploy-testnet.yml@Rubydusa/separate-verification-job-from-deployment
    with:
      deploy-script: "script/Deploy.s.sol:Deploy"
      verify-contracts: true
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      RPC_URL: ${{ secrets.RPC_URL }}
