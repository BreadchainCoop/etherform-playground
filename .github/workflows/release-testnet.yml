name: Release Testnet
on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
    uses: BreadchainCoop/etherform/.github/workflows/_release-testnet.yml@Rubydusa/address-release-on-merge
    with:
      deploy-script: script/Deploy.s.sol:Deploy
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      RPC_URL: ${{ secrets.RPC_URL }}

