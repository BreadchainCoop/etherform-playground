name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  foundry:
    uses: BreadchainCoop/etherform/.github/workflows/_foundry-cicd.yml@Rubydusa/sticky-pr-comment-with-addresses
    permissions:
      contents: read
      pull-requests: write
    with:
      deploy-on-pr: true
      deploy-script: "script/Deploy.s.sol:Deploy"
      run-slither: false
      run-coverage: true
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      RPC_URL: ${{ secrets.RPC_URL }}

